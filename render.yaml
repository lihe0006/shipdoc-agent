# Render Blueprint — New → Blueprint → pick this repo.
services:
  - type: web
    name: shipdoc-agent
    runtime: node
    # Starter keeps the server always on. On the free plan it sleeps when idle
    # (first visit takes ~1 min) and restarts clear all in-memory results.
    plan: starter
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: AUTH_SECRET
        generateValue: true
